# Render Blueprint: https://render.com/docs/blueprint-spec
# Import this repo on Render → New → Blueprint, or create a Background Worker manually with the same settings.

services:
  - type: worker
    name: bytebets-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npm run register-commands
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
